<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Панель менеджера (демо) — TEFAST B2B</title><meta name="theme-color" content="#FFDE01"><link rel="icon" href="../logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="b2b.css">
<style>
.ah{background:var(--ink);color:#fff;display:flex;align-items:center;gap:14px;padding:10px 24px;flex-wrap:wrap}.ah img{height:34px;width:auto}.ah b{font:600 14px var(--hf)}.ah .sp{margin-left:auto;display:flex;gap:8px}
.wrap{max-width:1200px;margin:0 auto;padding:16px 24px 64px;display:grid;gap:16px}
.ed{position:fixed;top:0;right:0;bottom:0;width:min(440px,100vw);background:#fff;z-index:80;padding:22px;overflow:auto;transform:translateX(105%);transition:transform var(--d) var(--ease-in);box-shadow:-20px 0 40px -30px rgba(0,0,0,.5)}
.ed.on{transform:none;transition:transform var(--d-slow) var(--ease)}
.ov{position:fixed;inset:0;background:rgba(41,40,45,.5);z-index:70;opacity:0;pointer-events:none;transition:opacity var(--d) var(--ease-in)}.ov.on{opacity:1;pointer-events:auto;transition:opacity var(--d-slow) var(--ease)}
.ed form{display:grid;gap:12px}.ed h2{margin-bottom:6px}
tr[data-a]{cursor:pointer}
</style>
</head>
<body>
<div class="ah"><a href="../index.html"><img src="../logo.png" alt="TEFAST"></a><b>Панель менеджера (демо)</b><div class="sp"><a class="btn btn-l btn-s" href="login.html">Кабінет СТО</a><button class="btn btn-y btn-s" id="rs" type="button">Скинути демо-дані</button></div></div>
<main class="wrap" id="view" aria-live="polite"></main>
<div class="ov" id="ov"></div><aside class="ed" id="ed" aria-label="Редагування СТО"></aside>
<script src="../assets/tree.js"></script><script src="../assets/data.js"></script><script src="b2b.js"></script>
<script>
(()=>{const {$,$$,money,fd,db,save,stBadge,oBadge,toast,reset,seg,byId}=B2B;
let cur=null;
const OS=['Новий','В обробці','Відправлено','Виконано','Скасовано'];
function draw(){const D=db(),cnt=s=>D.accounts.filter(a=>a.status===s).length;
 $('#view').innerHTML=`<div class="note info"><span>Це імітація панелі менеджера: зміни зберігаються в браузері й одразу впливають на кабінет СТО (ціни, ліміт, статус).</span></div>
 <div class="row4"><div class="card kpi"><small>Нові заявки</small><b>${cnt('new')}</b></div><div class="card kpi"><small>Верифіковані</small><b>${cnt('verified')}</b></div><div class="card kpi"><small>Призупинені</small><b>${cnt('suspended')}</b></div>
  <div class="card kpi"><small>Верифікація нових</small><div class="seg" id="vm"><button data-v="manual" class="${D.settings.verifyMode==='manual'?'on':''}">Ручна</button><button data-v="auto" class="${D.settings.verifyMode==='auto'?'on':''}">Автоматична</button></div><span>для нових реєстрацій</span></div></div>
 <div class="card" style="padding:8px 8px 0"><h2 style="padding:12px 12px 0">СТО-партнери</h2><div class="tw"><table class="t"><thead><tr><th>СТО</th><th>ЄДРПОУ</th><th>Статус</th><th>Ціни</th><th class="r">Мін. замовлення</th><th>Відстрочка</th><th class="r">Ліміт (використано)</th></tr></thead><tbody>
 ${D.accounts.map(a=>`<tr data-a="${a.id}" tabindex="0"><td><b>${a.name}</b><br><small style="color:var(--mut)">${a.contact} · ${a.email}</small></td><td class="m">${a.edrpou}</td><td>${stBadge(a.status)}</td><td>${a.terms.mode==='fixed'?'−'+money(a.terms.value)+'/од.':'−'+a.terms.value+'%'}</td><td class="r">${money(a.terms.minOrder)}</td><td>${a.terms.deferral?a.terms.deferralDays+' дн.':'—'}</td><td class="r">${a.terms.deferral?money(a.terms.creditLimit)+' ('+money(a.terms.used)+')':'—'}</td></tr>`).join('')}</tbody></table></div></div>
 <div class="card" style="padding:8px 8px 0"><h2 style="padding:12px 12px 0">Замовлення</h2>${D.orders.length?`<div class="tw"><table class="t"><thead><tr><th>Номер</th><th>СТО</th><th>Дата</th><th>Оплата</th><th class="r">Сума</th><th>Статус</th></tr></thead><tbody>
 ${[...D.orders].sort((a,b)=>b.date.localeCompare(a.date)).map(o=>{const a=D.accounts.find(x=>x.id===o.acc)||{name:'—'};return`<tr><td><b>${o.id}</b></td><td>${a.name}</td><td>${fd(o.date)}</td><td>${o.pay==='deferral'?'Відстрочка до '+fd(o.due):'Передоплата'}</td><td class="r"><b>${money(o.total)}</b></td><td><label class="sr" for="s${o.id}">Статус</label><select class="fl" id="s${o.id}" data-o="${o.id}" style="height:34px;border-radius:10px;border:1.5px solid var(--si-l);padding:0 8px;background:#fff">${OS.map(s=>`<option${s===o.status?' selected':''}>${s}</option>`).join('')}</select></td></tr>`}).join('')}</tbody></table></div>`:'<div class="empty"><b>Замовлень немає</b></div>'}</div>`;
 seg($('#vm'),v=>{db().settings.verifyMode=v;save();toast('Верифікація нових СТО: '+(v==='auto'?'автоматична':'ручна'))})}
function edit(id){cur=db().accounts.find(a=>a.id===id);const a=cur,t=a.terms;
 $('#ed').innerHTML=`<form id="ef" novalidate><h2>${a.name}</h2><small style="color:var(--mut)">ЄДРПОУ ${a.edrpou} · ${a.contact}, ${a.phone}</small>
  <div><b style="font-size:13px">Статус</b><div class="seg" id="es" style="margin-top:6px;display:flex"><button type="button" data-v="new" class="${a.status==='new'?'on':''}">Новий</button><button type="button" data-v="verified" class="${a.status==='verified'?'on':''}">Верифікований</button><button type="button" data-v="suspended" class="${a.status==='suspended'?'on':''}">Призупинений</button></div></div>
  <label class="fl" id="rl" style="${a.status==='suspended'?'':'display:none'}">Причина призупинення<input id="re" value="${a.reason||''}"></label>
  <div><b style="font-size:13px">Індивідуальні ціни</b><div class="seg" id="em" style="margin-top:6px;display:flex"><button type="button" data-v="percent" class="${t.mode==='percent'?'on':''}">Знижка, %</button><button type="button" data-v="fixed" class="${t.mode==='fixed'?'on':''}">Фіксована, ₴/од.</button></div></div>
  <div class="g2"><label class="fl" id="vl">${t.mode==='fixed'?'Знижка, ₴ за одиницю':'Знижка, %'}<input id="ev" type="number" min="0" value="${t.value}"></label><label class="fl">Мін. замовлення, ₴<input id="emn" type="number" min="0" value="${t.minOrder}"></label></div>
  <label class="opt" style="align-items:center"><input type="checkbox" id="ed2" ${t.deferral?'checked':''}><span>Відстрочка платежу та кредитний ліміт</span></label>
  <div class="g3" id="dg" style="${t.deferral?'':'opacity:.5;pointer-events:none'}"><label class="fl">Днів<input id="edd" type="number" min="0" value="${t.deferralDays}"></label><label class="fl">Ліміт, ₴<input id="ecl" type="number" min="0" value="${t.creditLimit}"></label><label class="fl">Використано, ₴<input id="eu" type="number" min="0" value="${t.used}"></label></div>
  <div style="display:flex;gap:8px;margin-top:6px"><button class="btn btn-y" type="submit">Зберегти</button><button class="btn btn-l" type="button" id="cx">Закрити</button></div></form>`;
 let status=a.status,mode=t.mode;
 seg($('#es'),v=>{status=v;$('#rl').style.display=v==='suspended'?'':'none'});seg($('#em'),v=>{mode=v;$('#vl').firstChild.textContent=v==='fixed'?'Знижка, ₴ за одиницю':'Знижка, %'});
 $('#ed2').onchange=e=>{$('#dg').style.cssText=e.target.checked?'':'opacity:.5;pointer-events:none'};
 $('#cx').onclick=close;
 $('#ef').onsubmit=e=>{e.preventDefault();const n=k=>Math.max(0,+$('#'+k).value||0);a.status=status;a.reason=status==='suspended'?$('#re').value.trim():'';
  Object.assign(a.terms,{mode,value:n('ev'),minOrder:n('emn'),deferral:$('#ed2').checked,deferralDays:n('edd'),creditLimit:n('ecl'),used:n('eu')});if(!a.terms.deferral){a.terms.deferralDays=0}save();close();draw();toast('Збережено')};
 $('#ed').classList.add('on');$('#ov').classList.add('on');requestAnimationFrame(()=>{$('#es')._mv&&$('#es')._mv();$('#em')._mv&&$('#em')._mv()})}
function close(){$('#ed').classList.remove('on');$('#ov').classList.remove('on')}
$('#ov').onclick=close;addEventListener('keydown',e=>{if(e.key==='Escape')close();if(e.key==='Enter'&&e.target.matches('tr[data-a]'))edit(e.target.dataset.a)});
$('#view').addEventListener('click',e=>{const r=e.target.closest('tr[data-a]');if(r)edit(r.dataset.a)});
$('#view').addEventListener('change',e=>{const s=e.target.closest('select[data-o]');if(s){const o=db().orders.find(x=>x.id===s.dataset.o);o.status=s.value;save();toast('Статус замовлення '+o.id+': '+s.value)}});
$('#rs').onclick=()=>{reset();toast('Демо-дані скинуто');draw()};
draw();
})();
</script>
</body></html>
